{% extends 'base.html' %}

{% block title %}Удалить категорию{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 text-center">
                <div class="rounded-circle bg-danger bg-opacity-10 d-inline-flex align-items-center justify-content-center mb-3"
                     style="width:60px;height:60px;">
                    <i class="bi bi-trash text-danger fs-3"></i>
                </div>
                <h5 class="fw-bold mb-2">Удалить категорию?</h5>
                <p class="text-muted mb-1">
                    Категория <strong>«{{ object.name }}»</strong> будет удалена.
                </p>
                <p class="text-muted small mb-4">
                    Транзакции сохранятся, но поле категории у них станет пустым.
                </p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2 justify-content-center">
                        <a href="{% url 'category-list' %}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i>Отмена
                        </a>
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash me-1"></i>Да, удалить
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
