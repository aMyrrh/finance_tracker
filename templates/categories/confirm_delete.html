{% extends 'base.html' %}

{% block title %}Удалить категорию{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card border-danger shadow-sm">
            <div class="card-body p-4 text-center">
                <i class="bi bi-exclamation-triangle text-danger fs-1"></i>
                <h3 class="mt-2">Удалить категорию?</h3>
                <p class="text-muted">
                    Категория <strong>«{{ object.name }}»</strong> будет удалена.
                    Транзакции с этой категорией сохранятся, но категория у них станет пустой.
                </p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2 justify-content-center">
                        <button type="submit" class="btn btn-danger">Да, удалить</button>
                        <a href="{% url 'category-list' %}" class="btn btn-outline-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
