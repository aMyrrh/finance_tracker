{% extends 'base.html' %}

{% block title %}Вход — Мои финансы{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-sm-10 col-md-6 col-lg-4">
        <div class="text-center mb-4">
            <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
                 style="width:64px;height:64px;font-size:1.8rem;">
                <i class="bi bi-wallet2"></i>
            </div>
            <h1 class="h3 fw-bold">Мои финансы</h1>
            <p class="text-muted">Войдите в свой аккаунт</p>
        </div>

        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4">
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">{{ field.label }}</label>
                        <input
                            type="{{ field.field.widget.input_type }}"
                            name="{{ field.html_name }}"
                            class="form-control {% if field.errors %}is-invalid{% endif %}"
                            {% if field.value %}value="{{ field.value }}"{% endif %}
                            autocomplete="{{ field.html_name }}"
                        >
                        {% for error in field.errors %}
                            <div class="invalid-feedback">{{ error }}</div>
                        {% endfor %}
                    </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-primary w-100 py-2 mt-1">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Войти
                    </button>
                </form>
            </div>
        </div>

        <p class="text-center mt-3 text-muted small">
            Нет аккаунта? <a href="{% url 'register' %}" class="fw-semibold">Зарегистрироваться</a>
        </p>
    </div>
</div>
{% endblock %}
