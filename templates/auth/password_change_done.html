{% extends 'base.html' %}

{% block title %}Пароль изменён{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 text-center">
            <div class="card-body p-5">
                <div class="rounded-circle bg-success bg-opacity-10 d-inline-flex align-items-center justify-content-center mb-3"
                     style="width:60px;height:60px;">
                    <i class="bi bi-check-circle text-success fs-3"></i>
                </div>
                <h5 class="fw-bold mb-2">Пароль успешно изменён!</h5>
                <p class="text-muted mb-4">Используйте новый пароль при следующем входе.</p>
                <a href="{% url 'profile' %}" class="btn btn-primary">
                    <i class="bi bi-arrow-left me-1"></i>Вернуться в профиль
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
